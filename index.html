<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素沙盒生存 - Terraria风格</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #game { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
window.addEventListener('error', function(e) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;color:red;font-family:monospace;font-size:14px;padding:10px;background:#fff;z-index:9999;white-space:pre-wrap;';
  d.textContent = 'JS错误: ' + (e.message || (e.error && e.error.message) || '') + '\n' + (e.error && e.error.stack || '');
  document.body.appendChild(d);
});
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
